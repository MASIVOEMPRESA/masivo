<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masivo Barber — Reservá tu turno</title>
<meta name="description" content="Reservá tu turno en Masivo Barber, dejá tu reseña, mirá cómo llegar o entrá a la Academia. Todo en un toque.">

<link rel="canonical" href="https://masivobarber.vercel.app/">

<meta property="og:type" content="website">
<meta property="og:locale" content="es_AR">
<meta property="og:site_name" content="Masivo Barber">
<meta property="og:title" content="Masivo Barber — Reservá tu turno">
<meta property="og:description" content="Reservá tu turno, dejá tu reseña, mirá cómo llegar o entrá a la Academia.">
<meta property="og:url" content="https://masivobarber.vercel.app/">
<meta name="twitter:card" content="summary">

<link rel="icon" href="/img/app/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;0,900;1,800;1,900&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #05070a;
    --cyan: #00e5ff;
    --cyan-soft: #7ef6ff;
    --violet: #8b6cff;
    --white: #f4f9fb;
    --muted: #8d9ca7;
    --line: rgba(255, 255, 255, 0.09);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --font-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    background: var(--ink);
    color: var(--white);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- fondo universo ---------- */

  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background:
      radial-gradient(1100px 760px at 50% -18%, rgba(139, 108, 255, 0.22), transparent 62%),
      radial-gradient(820px 620px at 88% 108%, rgba(0, 229, 255, 0.14), transparent 60%),
      radial-gradient(700px 520px at 6% 82%, rgba(139, 108, 255, 0.12), transparent 62%),
      var(--ink);
  }

  .stars {
    position: absolute;
    inset: -25%;
    background-repeat: repeat;
    will-change: transform;
  }

  .stars--a {
    background-image: radial-gradient(circle, rgba(244, 249, 251, 0.85) 0.7px, transparent 1px);
    background-size: 92px 92px;
    opacity: 0.55;
    animation: drift 140s linear infinite;
  }

  .stars--b {
    background-image: radial-gradient(circle, rgba(126, 246, 255, 0.7) 0.9px, transparent 1.2px);
    background-size: 173px 173px;
    background-position: 40px 60px;
    opacity: 0.45;
    animation: drift 220s linear infinite reverse;
  }

  .stars--c {
    background-image: radial-gradient(circle, rgba(192, 176, 255, 0.6) 1.2px, transparent 1.5px);
    background-size: 310px 310px;
    background-position: 120px 20px;
    opacity: 0.35;
    animation: drift 320s linear infinite;
  }

  @keyframes drift {
    from { transform: translate3d(0, 0, 0); }
    to { transform: translate3d(-92px, 92px, 0); }
  }

  .shooting {
    position: absolute;
    top: 16%;
    left: -20%;
    width: 150px;
    height: 1.5px;
    border-radius: 99px;
    background: linear-gradient(90deg, transparent, rgba(126, 246, 255, 0.9), #fff);
    filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.8));
    opacity: 0;
    transform: rotate(16deg);
    animation: shoot 11s var(--ease) infinite;
  }

  @keyframes shoot {
    0%, 88% { opacity: 0; transform: translate3d(0, 0, 0) rotate(16deg); }
    90% { opacity: 1; }
    100% { opacity: 0; transform: translate3d(150vw, 46vh, 0) rotate(16deg); }
  }

  /* ---------- contenido ---------- */

  .tree {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
  }

  .hero {
    text-align: center;
    animation: rise 0.7s var(--ease) both;
  }

  .mark {
    display: grid;
    place-items: center;
    width: 66px;
    height: 66px;
    margin: 0 auto 16px;
    border: 1px solid rgba(0, 229, 255, 0.55);
    color: var(--cyan);
    font-family: var(--font-display);
    font-size: 40px;
    font-style: italic;
    font-weight: 900;
    line-height: 1;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.14), 0 0 34px rgba(0, 229, 255, 0.18);
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .hero h1 {
    font-family: var(--font-display);
    font-size: clamp(44px, 13vw, 58px);
    font-style: italic;
    font-weight: 900;
    line-height: 0.88;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    text-shadow: 0 0 34px rgba(0, 229, 255, 0.28);
  }

  .hero h1 span {
    display: block;
    margin-top: 8px;
    font-family: var(--font-body);
    font-size: 11px;
    font-style: normal;
    font-weight: 700;
    letter-spacing: 0.5em;
    color: var(--cyan);
    text-indent: 0.5em;
  }

  .tagline {
    margin-top: 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  /* ---------- botones ---------- */

  .links {
    display: grid;
    gap: 12px;
    margin-top: 30px;
  }

  .link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 76px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.02));
    color: inherit;
    text-decoration: none;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.22s var(--ease), border-color 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
    animation: rise 0.6s var(--ease) both;
    animation-delay: var(--d, 0ms);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .link:active {
    transform: scale(0.985);
  }

  .link:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 3px;
  }

  .icon {
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border: 1px solid rgba(0, 229, 255, 0.24);
    border-radius: 14px;
    background: rgba(0, 229, 255, 0.08);
    color: var(--cyan);
  }

  .icon svg {
    width: 22px;
    height: 22px;
  }

  .copy {
    flex: 1;
    min-width: 0;
  }

  .copy b {
    display: block;
    font-family: var(--font-display);
    font-size: 21px;
    font-style: italic;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .copy small {
    display: block;
    margin-top: 3px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    line-height: 1.35;
  }

  .go {
    flex-shrink: 0;
    color: rgba(255, 255, 255, 0.35);
    transition: transform 0.22s var(--ease), color 0.22s ease;
  }

  .go svg {
    display: block;
    width: 18px;
    height: 18px;
  }

  /* ---------- destacado ---------- */

  .link--featured {
    min-height: 92px;
    padding: 16px 18px;
    border: 0;
    background: linear-gradient(118deg, #00e5ff 0%, #4fc3ff 42%, #8b6cff 100%);
    color: #05070a;
    box-shadow: 0 20px 46px rgba(0, 229, 255, 0.22), 0 8px 24px rgba(139, 108, 255, 0.24);
  }

  .link--featured::before {
    content: "";
    position: absolute;
    inset: -40% -10%;
    background: radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.5), transparent 55%);
    opacity: 0.5;
    animation: breathe 4.5s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.35; transform: scale(0.95); }
    50% { opacity: 0.65; transform: scale(1.05); }
  }

  .link--featured::after {
    content: "";
    position: absolute;
    top: 0;
    left: -60%;
    width: 45%;
    height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
    transform: skewX(-18deg);
    animation: shine 5.5s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes shine {
    0%, 62% { left: -60%; }
    82%, 100% { left: 130%; }
  }

  .link--featured .icon {
    border-color: rgba(5, 7, 10, 0.18);
    background: rgba(5, 7, 10, 0.16);
    color: #05070a;
  }

  .link--featured .copy b {
    font-size: 27px;
    letter-spacing: 0.015em;
  }

  .link--featured .copy small {
    color: rgba(5, 7, 10, 0.72);
    font-weight: 700;
  }

  .link--featured .go {
    color: rgba(5, 7, 10, 0.55);
  }

  .link--featured .copy,
  .link--featured .icon,
  .link--featured .go {
    position: relative;
    z-index: 1;
  }

  /* ---------- pie ---------- */

  .foot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-top: 26px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    animation: rise 0.7s var(--ease) both;
    animation-delay: 420ms;
  }

  .foot a {
    color: rgba(244, 249, 251, 0.72);
    text-decoration: none;
    border-bottom: 1px solid rgba(0, 229, 255, 0.3);
    padding-bottom: 1px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .foot a:hover {
    color: var(--cyan-soft);
    border-color: var(--cyan);
  }

  /* ---------- hover solo con mouse ---------- */

  @media (hover: hover) and (pointer: fine) {
    .link:not(.link--featured):hover {
      transform: translateY(-2px);
      border-color: rgba(0, 229, 255, 0.38);
      background: linear-gradient(180deg, rgba(0, 229, 255, 0.1), rgba(255, 255, 255, 0.03));
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35), 0 0 26px rgba(0, 229, 255, 0.12);
    }

    .link:hover .go {
      transform: translateX(3px);
      color: var(--cyan-soft);
    }

    .link--featured:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 56px rgba(0, 229, 255, 0.3), 0 10px 28px rgba(139, 108, 255, 0.3);
    }

    .link--featured:hover .go {
      color: #05070a;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }

  @media (max-height: 640px) {
    .mark { width: 54px; height: 54px; font-size: 32px; margin-bottom: 10px; }
    .hero h1 { font-size: clamp(34px, 10vw, 44px); }
    .links { margin-top: 20px; gap: 10px; }
    .link { min-height: 68px; }
    .link--featured { min-height: 82px; }
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <span class="stars stars--a"></span>
  <span class="stars stars--b"></span>
  <span class="stars stars--c"></span>
  <span class="shooting"></span>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-scissors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88"/><path d="M14.47 14.48 20 20"/><path d="M8.12 8.12 12 12"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-cap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 9 12 4 2 9l10 5 10-5Z"/><path d="M6 11.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></symbol>
</svg>

<main class="tree">
  <header class="hero">
    <span class="mark">M</span>
    <h1>MASIVO<span>BARBER</span></h1>
    <p class="tagline">Elegí tu próximo paso ✂️</p>
  </header>

  <nav class="links" aria-label="Accesos rápidos de Masivo Barber">
    <a class="link link--featured" href="https://app.growthbarber.com/reserva/masivo?ref=bio" style="--d:80ms">
      <span class="icon" aria-hidden="true"><svg><use href="#i-scissors"/></svg></span>
      <span class="copy">
        <b>Reservar turno</b>
        <small>Elegí día y horario online</small>
      </span>
      <span class="go" aria-hidden="true"><svg><use href="#i-arrow"/></svg></span>
    </a>

    <a class="link" href="https://g.page/r/CUXgko6IPGfOEBM/review" style="--d:160ms">
      <span class="icon" aria-hidden="true"><svg><use href="#i-star"/></svg></span>
      <span class="copy">
        <b>Dejar reseña</b>
        <small>Contanos cómo te fue ⭐</small>
      </span>
      <span class="go" aria-hidden="true"><svg><use href="#i-arrow"/></svg></span>
    </a>

    <a class="link" href="https://maps.app.goo.gl/4uCVWf82vk8TWYjr6" style="--d:240ms">
      <span class="icon" aria-hidden="true"><svg><use href="#i-pin"/></svg></span>
      <span class="copy">
        <b>Cómo llegar</b>
        <small>Av. Félix Aguilar 2809, Canning</small>
      </span>
      <span class="go" aria-hidden="true"><svg><use href="#i-arrow"/></svg></span>
    </a>

    <a class="link" href="/academia/" style="--d:320ms">
      <span class="icon" aria-hidden="true"><svg><use href="#i-cap"/></svg></span>
      <span class="copy">
        <b>Academia</b>
        <small>Cursos y formación profesional 🎓</small>
      </span>
      <span class="go" aria-hidden="true"><svg><use href="#i-arrow"/></svg></span>
    </a>
  </nav>

  <footer class="foot">
    <a href="/guias/">Guía post-corte</a>
    <span>Masivo Barber · Canning, Ezeiza</span>
  </footer>
</main>

</body>
</html>
